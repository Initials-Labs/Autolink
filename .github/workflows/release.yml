name: release

on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the csproj version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          csproj=$(grep -oPm1 '(?<=<Version>)[^<]+' src/Initials.AutoLink/Initials.AutoLink.csproj)
          [ "$tag" = "$csproj" ] || { echo "Tag says $tag but the csproj declares $csproj"; exit 1; }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Autolink.slnx

      - name: Build
        run: dotnet build Autolink.slnx --no-restore -c Release

      - name: Test
        run: dotnet test tests/Initials.AutoLink.Tests/Initials.AutoLink.Tests.csproj --no-build -c Release

      - name: Pack
        run: dotnet pack src/Initials.AutoLink/Initials.AutoLink.csproj --no-build -c Release -o artifacts

      - name: Get a short-lived key from nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: scottishcoder

      - name: Push to nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
