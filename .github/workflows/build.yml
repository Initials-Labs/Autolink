name: build

on:
  # Every branch, not just main: a feature branch that only gets validated once a pull request exists is a feature
  # branch nobody is checking.
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # One version number lives in five places: the csproj, the manifest, and a cache-buster on each of the
      # three asset paths. They drift the first release somebody bumps four of them, and a stale ?v= serves a
      # consumer last version's dashboard out of their browser cache. Cheaper to check than to notice.
      - name: Check the version numbers agree
        run: |
          csproj=$(grep -oPm1 '(?<=<Version>)[^<]+' src/Initials.AutoLink/Initials.AutoLink.csproj)
          echo "csproj declares $csproj"
          manifest=$(grep -oPm1 '"version"\s*:\s*"\K[^"]+' src/Initials.AutoLink/wwwroot/umbraco-package.json)
          [ "$manifest" = "$csproj" ] || { echo "umbraco-package.json declares $manifest"; exit 1; }
          for v in $(grep -oP '\?v=\K[^"]+' src/Initials.AutoLink/wwwroot/umbraco-package.json); do
            [ "$v" = "$csproj" ] || { echo "an asset path is cache-busted with ?v=$v"; exit 1; }
          done

      # The Marketplace reads this from the default branch root, so a typo here is only visible on the listing.
      # Validated against the real schema, not just parsed: a misspelt Category is well-formed JSON that the
      # Marketplace quietly ignores. regex-variant python because Umbraco's schema contains a \: escape that
      # is illegal in strict ECMA regexes, so the default engine rejects the schema itself.
      - name: Check the Marketplace listing file against the schema
        run: pipx run check-jsonschema --regex-variant python --schemafile https://marketplace.umbraco.com/umbraco-marketplace-schema.json umbraco-marketplace.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Autolink.slnx

      # The package treats warnings as errors, so this fails on a new warning rather than letting one ship.
      - name: Build
        run: dotnet build Autolink.slnx --no-restore -c Release

      - name: Test
        run: dotnet test tests/Initials.AutoLink.Tests/Initials.AutoLink.Tests.csproj --no-build -c Release --logger "console;verbosity=normal"

      - name: Pack
        run: dotnet pack src/Initials.AutoLink/Initials.AutoLink.csproj --no-build -c Release -o artifacts

      # Guards the two things that silently break a package: the dashboard not shipping, and a stray dependency.
      - name: Check the package contents
        run: |
          unzip -l artifacts/*.nupkg
          unzip -l artifacts/*.nupkg | grep -q 'staticwebassets/umbraco-package.json' || { echo 'The backoffice manifest is missing from the package'; exit 1; }
          unzip -l artifacts/*.nupkg | grep -q 'staticwebassets/autolink-keywords.js' || { echo 'The dashboard is missing from the package'; exit 1; }
          unzip -l artifacts/*.nupkg | grep -q 'lib/net10.0/Initials.AutoLink.xml' || { echo 'The XML docs are missing, so AutoLinkOptions ships without its comments'; exit 1; }
          unzip -l artifacts/*.nupkg | grep -q 'README.md' || { echo 'The README is missing, so nuget.org has no landing page'; exit 1; }
          unzip -l artifacts/*.nupkg | grep -q 'AutolinkLogo.png' || { echo 'The icon is missing, so both listings fall back to a placeholder'; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
